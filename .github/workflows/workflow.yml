permissions:
  contents: write

name: Build and Release Upper

on:
  push:
    branches: [None]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi cmake ninja-build

      - name: Configure CMake
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build firmware
        run: cmake --build build --config Release

      - name: Generate tag
        id: tag
        run: |
          DATE_MM_DD="$(date +%m_%d)"
          TAG="Upper_${DATE_MM_DD}_$(printf '%03d' "$GITHUB_RUN_NUMBER")"

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "date_mm_dd=$DATE_MM_DD" >> $GITHUB_OUTPUT

      - name: Prepare release assets
        run: |
          cp "build/STM32H743.elf" "build/UF4DP_Upper_${{ steps.tag.outputs.date_mm_dd }}.elf"
          cp "build/STM32H743.hex" "build/UF4DP_Upper_${{ steps.tag.outputs.date_mm_dd }}.hex"
          cp "build/STM32H743.bin" "build/UF4DP_Upper_${{ steps.tag.outputs.date_mm_dd }}.bin"

      - name: Create Release + Upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Firmware ${{ steps.tag.outputs.tag }}
          files: |
            build/UF4DP_Upper_${{ steps.tag.outputs.date_mm_dd }}.elf
            build/UF4DP_Upper_${{ steps.tag.outputs.date_mm_dd }}.hex
            build/UF4DP_Upper_${{ steps.tag.outputs.date_mm_dd }}.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}